name: personal_dashboard
description: Personal finance dashboard – Flutter port of PWA.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.4
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3+2
  path: ^1.9.0
  shared_preferences: ^2.2.3
  http: ^1.2.1
  fl_chart: ^0.68.0
  uuid: ^4.4.0
  connectivity_plus: ^6.0.3
  share_plus: ^9.0.0
  path_provider: ^2.1.3
  # Excel (.xlsx) / Word (.docx) export: both are OOXML zip packages, written
  # by hand in lib/core/export_xlsx.dart and lib/core/export_docx.dart.
  archive: ^3.6.1
  # Receipt scanner: capture a price list and read it with on-device OCR.
  # google_mlkit_text_recognition ships Android/iOS only - the scan menus are
  # hidden elsewhere (see ReceiptScanner.isSupported).
  image_picker: ^1.1.0
  google_mlkit_text_recognition: '>=0.13.0 <1.0.0'
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1
  flutter_timezone: ^5.1.0
  workmanager: ^0.10.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
